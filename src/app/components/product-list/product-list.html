<div class="mb-4">
    <h2 class="mb-3">Available Products</h2>
    <input type="text" class="form-control form-control-lg" placeholder="🔍 Search products by name..."
        [(ngModel)]="searchTerm">
</div>

<div *ngIf="filteredProducts.length === 0" class="alert alert-info text-center">
    No products found matching your search.
</div>

<div class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of filteredProducts">
        <div class="card h-100 shadow-sm">
            <img [src]="item.image || 'https://placeholder.com'" [routerLink]="['/product', item.id]"
                class="card-img-top" style="height: 200px; object-fit: cover; cursor: pointer;">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title" [routerLink]="['/product', item.id]" style="cursor: pointer;">{{ item.name }}
                </h5>
                <p class="card-text text-muted">{{ item.description | slice:0:80 }}{{ item.description.length > 80 ?
                    '...' : '' }}</p>

                <div class="mt-auto">
                    <h4 class="text-success fw-bold mb-3">{{ item.price }} TND</h4>
                    <div class="d-flex gap-2">
                        <!-- يظهر زر الإضافة للسلة فقط لغير الأدمن -->
                        <button *ngIf="!authService.isAdmin()" type="button" class="btn btn-success flex-grow-1"
                            (click)="addToBasket(item)">
                            🛒 Add to Cart
                        </button>
                        <a [routerLink]="['/product', item.id]" class="btn btn-outline-primary flex-grow-1">
                            Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
