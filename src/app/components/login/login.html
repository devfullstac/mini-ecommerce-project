<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">Login</h3>

            <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

            <form (ngSubmit)="onLogin()">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email"
                        placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password"
                        placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>

            <div class="text-center my-3 text-muted">OR</div>

            <!-- أزرار Google و Facebook -->
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-danger" (click)="socialLogin('Google')">
                    Continue with Google
                </button>
                <button type="button" class="btn btn-outline-primary" (click)="socialLogin('Facebook')">
                    Continue with Facebook
                </button>
            </div>

            <p class="text-center mt-3 mb-0">
                Don't have an account? <a routerLink="/register">Register here</a>
            </p>
        </div>
    </div>
</div>
