<div class="mb-3">
    <a routerLink="/products" class="btn btn-outline-secondary btn-sm">← Back to Products</a>
</div>

<div class="card shadow p-4" *ngIf="product">
    <div class="row">
        <!-- صورة المنتج -->
        <div class="col-md-5 mb-3">
            <img [src]="product.image || 'https://placeholder.com'" class="img-fluid rounded border"
                style="width: 100%; max-height: 350px; object-fit: cover;">
        </div>

        <!-- تفاصيل المنتج ونموذج الطلب -->
        <div class="col-md-7">
            <div class="d-flex justify-content-between align-items-start">
                <h2>{{ product.name }}</h2>
                <button type="button" class="btn btn-outline-danger" (click)="addToFavorites()">
                    ❤️ Add to Favorites
                </button>
            </div>

            <h3 class="text-success fw-bold my-3">{{ product.price }} TND</h3>
            <p class="text-muted">{{ product.description }}</p>

            <hr>

            <!-- نموذج تمرير الطلبية أو الإضافة للسلة -->
            <div class="bg-light p-3 rounded border">
                <h5 class="mb-3">🛍️ Order or Add to Cart</h5>

                <div class="row">
                    <div class="col-md-4 mb-2">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" min="1" [(ngModel)]="orderData.quantity">
                    </div>
                    <div class="col-md-8 mb-2">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" [(ngModel)]="orderData.phone"
                            placeholder="e.g. 22 123 456">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Delivery Address</label>
                    <input type="text" class="form-control" [(ngModel)]="orderData.address"
                        placeholder="Street, City, Postal Code">
                </div>

                <!-- هنا يوجد الزران جنباً إلى جنب -->
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-success w-50 fw-bold" (click)="addToCartFromDetails()">
                        🛒 Add to Cart
                    </button>
                    <button type="button" class="btn btn-primary w-50 fw-bold" (click)="placeOrder()">
                        ⚡ Direct Order ({{ product.price * orderData.quantity }} TND)
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
